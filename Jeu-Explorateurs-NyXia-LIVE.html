<!doctype html>
<html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Explorateurs NyXia — Le défi des 7 personnages</title>
<style>
:root{color-scheme:dark;--bg:#060A18;--gold:#C9A24A;--violet:#A78BFA;--txt:#f8f4ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Montserrat,Arial,sans-serif;color:var(--txt);background:radial-gradient(ellipse at 52% 22%,#25204e 0,transparent 46%),radial-gradient(ellipse at 75% 80%,#111e3d 0,transparent 50%),var(--bg);display:grid;place-items:center;padding:24px}.wrap{width:min(100%,1050px);border:1px solid #69542b;border-radius:25px;padding:clamp(20px,4vw,48px);background:#080d20e9;box-shadow:0 25px 100px #0009;text-align:center}.eyebrow{font-weight:700;letter-spacing:.19em;text-transform:uppercase;color:var(--gold);font-size:clamp(11px,1.8vw,16px)}h1{font-size:clamp(28px,5vw,58px);line-height:1.13;margin:14px 0 4px}h1 span{color:var(--violet)}.sub{color:#c8c0e4;font-size:clamp(15px,2vw,21px);margin:12px 0 30px}.counter{color:var(--gold);font-size:17px;letter-spacing:.1em;font-weight:700}.question{min-height:160px;display:grid;place-items:center;font-size:clamp(25px,4.2vw,44px);line-height:1.24;font-weight:750;padding:25px 0}.answer{min-height:116px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;border:1px solid #2c3552;border-radius:18px;background:#10172e;padding:16px}.name{font-size:clamp(27px,4vw,47px);color:#eccb7d;font-weight:800}.detail{font-size:clamp(15px,2vw,20px);color:#d1c8e7}.waiting{font-size:clamp(17px,2.4vw,25px);color:#b9aad6}button{font-family:inherit;font-size:clamp(16px,2vw,20px);font-weight:700;padding:17px 23px;border-radius:13px;cursor:pointer;min-width:190px}button:focus-visible{outline:3px solid #fff;outline-offset:4px}.buttons{display:flex;justify-content:center;flex-wrap:wrap;gap:15px;margin-top:25px}.primary{border:1px solid #e2bf68;background:linear-gradient(145deg,#ad843a,#e7c877);color:#09101e}.secondary{border:1px solid #b69d60;background:#101b30;color:#fff}.note{margin-top:28px;font-size:13px;color:#9995b0}.pill{margin-top:15px;color:#dcd1ef;font-size:16px}@media(max-width:550px){body{padding:10px}.wrap{padding:25px 15px}.question{min-height:180px}.buttons button{width:100%}}@media(prefers-reduced-motion:no-preference){.answer{transition:background .2s}}
</style></head><body><main class="wrap"><div class="eyebrow">Mission Explorateurs NyXia</div><h1>À qui <span>demanderais-tu</span> de l’aide ?</h1><div class="sub">Le défi des 7 personnages de Studio Prompt</div><div class="counter" id="counter">QUESTION 1 / 7</div><div class="question" id="question" aria-live="polite"></div><div class="answer" id="answer" aria-live="polite"></div><div class="buttons"><button class="primary" id="reveal">Révéler la réponse</button><button class="secondary" id="next">Question suivante →</button></div><div class="pill">À toi de deviner avant de révéler la réponse !</div><div class="note">Studio Prompt • NyXia</div></main><script>
const questions=[
{q:'Je voudrais écrire mon premier livre.',name:'Alex',detail:'Écriture et création littéraire'},
{q:'Je veux préparer une publication pour promouvoir mon activité.',name:'Éric',detail:'Communication et commercialisation'},
{q:'J’aimerais explorer des pratiques et connaissances spirituelles.',name:'Léna',detail:'Exploration spirituelle'},
{q:'Je cherche à mieux comprendre mes émotions.',name:'Séléna',detail:'Reconnexion à soi'},
{q:'Je voudrais réfléchir à mes relations amoureuses.',name:'Kael',detail:'Relations et vie affective'},
{q:'Je ne sais pas quelle porte de NyXia choisir.',name:'NyXia',detail:'Orientation dans l’univers'},
{q:'J’aimerais découvrir des mini-formations et apprendre progressivement.',name:'Diane',detail:'Apprentissage et mini-formations'}
];let index=0,shown=false;const q=document.getElementById('question'),a=document.getElementById('answer'),c=document.getElementById('counter'),reveal=document.getElementById('reveal');function draw(){const x=questions[index];c.textContent='QUESTION '+(index+1)+' / '+questions.length;q.textContent='« '+x.q+' »';a.replaceChildren();if(shown){const name=document.createElement('div'),detail=document.createElement('div');name.className='name';detail.className='detail';name.textContent=x.name;detail.textContent=x.detail;a.append(name,detail)}else{const wait=document.createElement('div');wait.className='waiting';wait.textContent='Quel personnage choisirais-tu ?';a.append(wait)}reveal.textContent=shown?'Masquer la réponse':'Révéler la réponse'}reveal.addEventListener('click',()=>{shown=!shown;draw()});document.getElementById('next').addEventListener('click',()=>{index=(index+1)%questions.length;shown=false;draw()});window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){index=(index+1)%questions.length;shown=false;draw()}if(e.key===' '){e.preventDefault();shown=!shown;draw()}});draw();
</script></body></html>
