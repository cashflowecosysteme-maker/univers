name = "univers-superadmin2"
main = "_worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Worker 2 uniquement pour les API de Super Admin 2.
# Super Admin 1 reste à la racine du dépôt et n'est pas modifié.
routes = [
  { pattern = "univers.nyxia.top/api/superadmin2/*", zone_name = "nyxia.top" }
]

# Même KV que Super Admin 1 uniquement lorsque le partage est volontaire.
[[kv_namespaces]]
binding = "CASHFLOW_KV"
id = "106db6da016d49d2b480452f19bad695"

[vars]
SITE_URL = "https://univers.nyxia.top"

# Optionnel plus tard pour téléverser directement les médias cœur et le fond officiel :
# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "nyxia-superadmin2-media"

# Secrets à définir dans l'environnement Cloudflare du Worker Super 2 :
# ADMIN_INITIAL_PASSWORD
# AIMLAPI_CREATOR_KEY
# PEXELS_KEY
# UNSPLASH_ACCES_KEY
# (le Worker accepte aussi UNSPLASH_ACCESS_KEY ou UNSPLASH_KEY)
