<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnostic du webhook NyXia</title>
<style>body{font:18px system-ui;background:#060a18;color:#eee;max-width:740px;margin:50px auto;padding:24px}label{display:block;margin:24px 0 8px}input,button{font:inherit;box-sizing:border-box;width:100%;padding:14px;border-radius:8px}button{background:#7b5cff;color:white;border:0;margin-top:24px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#171b30;padding:20px}small{display:block;margin-top:16px}</style>
<h1>Diagnostic du webhook NyXia</h1><p>Ce test utilise le webhook existant. S’il réussit, il active l’accès prévu par la campagne et peut envoyer le courriel d’activation à ton adresse de test.</p>
<form id="form"><label for="url">Lien du webhook (copie-le depuis ta règle Systeme.io)</label><input id="url" type="url" required autocomplete="off"><label for="email">Adresse courriel du contact utilisé pour ton test</label><input id="email" type="email" required autocomplete="off"><button id="test">Tester et afficher la réponse</button></form><pre id="result" aria-live="polite">En attente du test.</pre><small>Ce fichier s’ouvre sur ton ordinateur. Aucun fichier à déposer sur GitHub.</small>
<script>
document.getElementById('form').addEventListener('submit',async event=>{event.preventDefault();const output=document.getElementById('result'),button=document.getElementById('test');let url;try{url=new URL(document.getElementById('url').value.trim());if(url.origin!=='https://univers.nyxia.top'||!['/api/access/activate','/api/access/register'].includes(url.pathname)||(url.pathname==='/api/access/activate'&&!url.searchParams.get('campaign'))||!url.searchParams.get('key'))throw Error();}catch{output.textContent='Copie le lien complet du webhook univers.nyxia.top depuis ta règle Systeme.io.';return;}button.disabled=true;output.textContent='Test en cours…';const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);try{const response=await fetch(url.href,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim()}),signal:controller.signal});const raw=await response.text();let data;try{data=JSON.parse(raw);}catch{}output.textContent='HTTP '+response.status+'\n\n'+(data?.error|| (data?.success?'Le webhook a réussi. Vérifie le champ du contact et ton courriel.':raw.slice(0,4000)));}catch(error){output.textContent=error.name==='AbortError'?'Le serveur n’a pas répondu en 30 secondes. Le résultat est inconnu ; vérifie ton contact avant de recommencer.':'Le navigateur ne peut pas lire la réponse du serveur (connexion ou autorisation CORS). Copie ce message pour le diagnostic.';}finally{clearTimeout(timer);button.disabled=false;}});
</script></html>
