<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ton rendez-vous — Univers NyXia</title><link rel="icon" href="/FavIcon.png"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/closer/closer.css"></head><body><canvas id="starry-canvas" aria-hidden="true"></canvas><main style="max-width:680px"><p class="eyebrow">UNIVERS NYXIA</p><h1 id="title">Prépare ton rendez-vous</h1><p>Indique tes coordonnées, puis choisis ton créneau dans notre calendrier.</p><form class="card" id="bookingForm"><label>Ton nom<input name="buyer_name" required autocomplete="name"></label><label>Ton courriel<input name="buyer_email" type="email" required autocomplete="email"></label><label>Ton téléphone, si tu souhaites le communiquer<input name="phone" type="tel" autocomplete="tel"></label><p class="hint">Tes informations servent à préparer ton rendez-vous et à retrouver ta recommandation. Le rendez-vous sera confirmé après le choix de ton créneau.</p><p id="error" role="alert" class="form-error"></p><button type="submit" class="gold" id="submit" disabled>Choisir mon créneau</button></form></main><script src="/closer/booking.js" defer></script><script src="/js/starry-bg.js" defer></script></body></html>
