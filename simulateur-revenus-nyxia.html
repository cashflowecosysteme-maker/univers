<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NyXia | Simulateur de revenus</title><style>:root{font-family:Montserrat,Arial,sans-serif;color:#f5f1ff;background:#060A18}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 10%,#251a4a 0,transparent 45%),#060A18}main{max-width:1000px;margin:auto;padding:28px 18px 60px}h1{font-size:clamp(25px,4vw,42px);margin:8px 0}p{color:#c8c5db;line-height:1.5}.eyebrow{color:#C9A24A;letter-spacing:.15em;font-size:12px;text-transform:uppercase}.panel{background:rgba(16,21,44,.9);border:1px solid rgba(201,162,74,.45);border-radius:18px;padding:22px;margin:18px 0}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}label{display:block;color:#f4e9ce;font-weight:650;margin-bottom:9px}input,select{background:#090f25;color:white;border:1px solid #806a43;border-radius:10px;padding:13px;width:100%;font:inherit}input:focus,select:focus{outline:2px solid #C9A24A}.result{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{padding:20px 12px;background:#0b1229;border:1px solid #6b5838;border-radius:14px;text-align:center}.metric span{display:block;color:#cbc7dc;font-size:13px}.metric strong{display:block;margin:8px 0;font-size:clamp(23px,4vw,42px);color:#f6d487;font-variant-numeric:tabular-nums}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}button{cursor:pointer;background:#0a1430;border:1px solid #C9A24A;color:#f8dfab;padding:12px 18px;border-radius:10px;font-weight:700}button.primary{background:#C9A24A;color:#060A18}button:hover{filter:brightness(1.15)}#revealSection[hidden],#liveResult[hidden]{display:none}.note{font-size:12px;color:#b8b4c7}.live .result{grid-template-columns:1fr 1fr}.live .metric strong{font-size:clamp(36px,8vw,86px)}.live .metric:first-child{display:none}@media(max-width:600px){.controls,.result{grid-template-columns:1fr}.live .result{grid-template-columns:1fr 1fr}.panel{padding:16px}}</style></head><body><main id="app"><div class="eyebrow">NYXIA • DÉFI REVENUS</div><h1>Simulateur de revenus</h1><p>Choisis ton objectif, découvre la commission et relève le défi !</p><section class="panel"><div class="controls"><div><label for="goal">Objectif de commissions ($ CA)</label><input id="goal" type="number" value="1000" min="1" step="50"></div><div><label for="price">Prix de l'offre ($ CA)</label><input id="price" type="number" value="500" min="0" step="0.01"></div><div><label for="taxMode">Prix saisi</label><select id="taxMode"><option value="ex">Hors taxes</option><option value="in">Taxes québécoises comprises (TPS + TVQ)</option></select></div><div><label for="role">Rôle / commission</label><select id="role"><option value="8">Partenaire NyXia — 8 %</option><option value="25">Direction du développement commercial — 25 %</option><option value="5">Chef d’équipe — 5 %</option><option value="2">Bonus d'équipe — 2 %</option><option value="custom">Taux personnalisé</option></select></div><div id="customWrap" hidden><label for="customRate">Commission personnalisée (%)</label><input id="customRate" type="number" min="0" max="100" step="0.1" value="8"></div></div><div class="actions"><button class="primary" id="challenge">🎯 Lancer le défi (masquer le résultat)</button><button id="present">Mode LIVE</button><button id="reset">Réinitialiser</button></div></section><section class="panel" id="revealSection"><div class="result"><div class="metric"><span>Montant hors taxes</span><strong id="net">—</strong></div><div class="metric"><span>Commission par vente</span><strong id="perSale">—</strong></div><div class="metric"><span>Ventes nécessaires</span><strong id="sales">—</strong></div></div><p id="equation"></p></section><section class="panel" id="liveResult" hidden><h2>🎯 À vous de deviner !</h2><p>Combien de ventes faudrait-il pour atteindre cet objectif ?</p><button class="primary" id="reveal">Révéler la réponse</button></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('fr-CA',{style:'currency',currency:'CAD'}).format(n);const ids=['goal','price','taxMode','role','customRate'];function update(){let price=Math.max(0,Number($('price').value)||0),goal=Math.max(0,Number($('goal').value)||0),rate=$('role').value==='custom'?Number($('customRate').value)||0:Number($('role').value),net=$('taxMode').value==='in'?price/1.14975:price,comm=net*rate/100,count=comm>0?Math.ceil((goal-1e-9)/comm):0;$('customWrap').hidden=$('role').value!=='custom';$('net').textContent=fmt(net);$('perSale').textContent=fmt(comm);$('sales').textContent=comm>0?count.toLocaleString('fr-CA'):'—';$('equation').textContent=comm>0?`${count.toLocaleString('fr-CA')} ventes × ${fmt(comm)} ≈ ${fmt(count*comm)} de commissions.`:'Indique un prix et un taux supérieurs à zéro.'}ids.forEach(id=>$(id).addEventListener('input',update));$('challenge').onclick=()=>{$('revealSection').hidden=true;$('liveResult').hidden=false};$('reveal').onclick=()=>{$('revealSection').hidden=false;$('liveResult').hidden=true};$('present').onclick=()=>{document.body.classList.toggle('live');$('present').textContent=document.body.classList.contains('live')?'Quitter le mode LIVE':'Mode LIVE'};$('reset').onclick=()=>{$('goal').value=1000;$('price').value=500;$('taxMode').value='ex';$('role').value='8';$('customRate').value=8;$('revealSection').hidden=false;$('liveResult').hidden=true;update()};update()})();</script></body></html>
