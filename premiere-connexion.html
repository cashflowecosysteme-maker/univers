<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/FavIcon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Première connexion — Univers NyXia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg1:#0F1C3F;--bg2:#1A2554;--p:#7B5CFF;--p2:#5A6CFF;--p3:#4FA3FF;--t:#fff;--t2:#D6D9F0;--t3:#8891B8;--green:#00E676;--red:#FF4B6E}
    *{box-sizing:border-box;margin:0;padding:0} body{min-height:100vh;background:var(--bg1);color:var(--t2);font-family:'Outfit',sans-serif;display:flex;align-items:center;justify-content:center;overflow-x:hidden;overflow-y:auto}
    canvas#starry-canvas{position:fixed;inset:0;z-index:0;pointer-events:none} body:before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 30% 20%,rgba(123,92,255,.15),transparent 65%),radial-gradient(ellipse 50% 40% at 70% 80%,rgba(79,163,255,.08),transparent 60%);pointer-events:none}
    .wrap{position:relative;z-index:1;width:100%;max-width:440px;padding:24px}.card{background:rgba(26,37,84,.58);border:1px solid rgba(123,92,255,.22);border-radius:24px;padding:38px 34px;backdrop-filter:blur(20px);box-shadow:0 24px 80px rgba(0,0,0,.4)}
    .avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid rgba(123,92,255,.5);display:block;margin:0 auto 14px;box-shadow:0 0 34px rgba(123,92,255,.35)} h1{text-align:center;color:#fff;font-size:24px;margin-bottom:7px}.sub{text-align:center;color:var(--t3);font-size:13px;line-height:1.5;margin-bottom:28px}
    label{display:block;color:var(--t2);font-size:12px;font-weight:600;margin:0 0 7px}.field{margin-bottom:16px} input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(123,92,255,.25);background:rgba(8,15,34,.55);color:#fff;font:14px 'Outfit',sans-serif;outline:none}input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(123,92,255,.12)}
    button{width:100%;padding:13px 18px;border:0;border-radius:50px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font:600 14px 'Outfit',sans-serif;cursor:pointer;margin-top:4px}button:disabled{opacity:.55;cursor:wait}.pw-msg{display:none;padding:11px 13px;border-radius:11px;margin-top:15px;font-size:12px;text-align:center}.pw-msg.ok{display:block;color:#9cffc0;background:rgba(0,230,118,.09);border:1px solid rgba(0,230,118,.25)}.pw-msg.err{display:block;color:#ff9db0;background:rgba(255,75,110,.09);border:1px solid rgba(255,75,110,.25)}
    .back{text-align:center;margin-top:20px;font-size:12px}.back a{color:var(--p3);text-decoration:none}.note{font-size:11px;color:var(--t3);margin:-6px 0 15px}.hidden{display:none!important}
</style>
</head>
<body>
  <canvas id="starry-canvas"></canvas>
  <div class="wrap"><div class="card">
    <img class="avatar" src="/NyXia.png" alt="NyXia">
    <h1>Accès au Portail</h1>
    <div class="sub">Bienvenue dans l’Univers NyXia ! Prépare ton Accès Gratuit au portail.</div>
    <form id="first-setup-form" class="hidden">
      <div class="field"><label for="setup-password">Mot de passe</label><input id="setup-password" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="note">8 caractères minimum.</div>
      <div class="field"><label for="setup-confirm">Confirme ton mot de passe</label><input id="setup-confirm" type="password" autocomplete="new-password" minlength="8" required></div>
      <button id="setup-btn" type="submit">Créer mon mot de passe</button>
      <div id="setup-msg" class="pw-msg" role="status" aria-live="polite"></div>
    </form>
    <div id="access-msg" class="pw-msg" role="status" aria-live="polite"></div><div id="portal-links" class="back"></div>
  </div></div>
  <script src="/js/starry-bg.js" defer></script>
  <script>
  (function(){
    var token=new URLSearchParams(location.search).get('token')||'';
    var form=document.getElementById('first-setup-form'),button=document.getElementById('setup-btn'),msg=document.getElementById('access-msg'),links=document.getElementById('portal-links');
    var api='https://univers.nyxia.top';
    function show(text,ok){msg.textContent=text;msg.className='pw-msg '+(ok?'ok':'err');}
    function navigate(portals){
      form.classList.add('hidden');links.replaceChildren();
      if(!Array.isArray(portals)||!portals.length){show('Aucun portail disponible pour cet accès.',false);return;}
      if(portals.length===1){show('Redirection vers la connexion à '+portals[0].name+'…',true);setTimeout(function(){location.href=portals[0].loginUrl;},1500);return;}
      show('Choisis le portail auquel tu veux te connecter. Ton mot de passe est le même pour ces portails.',true);
      portals.forEach(function(portal){var a=document.createElement('a');a.href=portal.loginUrl;a.textContent='Se connecter à '+portal.name;a.style.cssText='display:block;margin:12px 0;padding:12px;border:1px solid #7B5CFF;border-radius:12px';links.appendChild(a);});
    }
    async function post(path,body){var r=await fetch(api+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});var d=await r.json();if(!r.ok||!d.ok){var e=Error(d.error||'Opération impossible.');e.data=d;throw e;}return d;}
    if(!token){show('Ce lien personnel est absent ou invalide. Utilise le lien reçu dans ton courriel NyXia.',false);return;}
    show('Vérification de ton lien personnel…',true);
    post('/api/access/invitation',{token:token}).then(function(data){if(data.existingAccount){navigate(data.portals);}else{msg.className='pw-msg';form.classList.remove('hidden');}}).catch(function(e){show(e.message||'Lien impossible à vérifier.',false);});
    form.addEventListener('submit',async function(event){
      event.preventDefault();if(!token)return;
      var password=document.getElementById('setup-password').value,confirm=document.getElementById('setup-confirm').value;
      if(password!==confirm){show('Les mots de passe ne correspondent pas.',false);return;}
      button.disabled=true;
      try{var data=await post('/api/access/password',{token:token,password:password,confirm:confirm});form.reset();sessionStorage.removeItem('nyxia_token');token='';navigate(data.portals);}
      catch(e){if(e.data&&e.data.portals){navigate(e.data.portals);}else{show(e.message||'Création impossible.',false);button.disabled=false;}}
    });
  })();
  </script>
</body>
</html>
