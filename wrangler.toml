name = "univers"
main = "_worker.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "."
binding = "ASSETS"

[[kv_namespaces]]
binding = "CASHFLOW_KV"
id = "106db6da016d49d2b480452f19bad695"

[[d1_databases]]
binding = "DB"
database_name = "nyxia-cercles-db"
database_id = "a21fd813-06fa-41f1-b744-07bf1c5c7951"

[vars]
SITE_URL = "https://univers.nyxia.top"
# ── À AJOUTER dans le wrangler.toml du Super Admin (univers) pour la vectorisation ──
# (garde tout ce que tu as déjà : CASHFLOW_KV, DB, assets…)

[[vectorize]]
binding = "VECTORIZE_INDEX"
index_name = "univers-livres"

[ai]
binding = "AI"

# L'index "univers-livres" doit déjà exister (1024 dimensions, cosine, modèle @cf/baai/bge-m3).
# Sans ces deux bindings, la gestion des personnages marche quand même ; seule la vectorisation
# affiche un avertissement tant qu'ils ne sont pas ajoutés.
