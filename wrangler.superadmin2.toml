name = "univers-superadmin2"
main = "workers/superadmin2-worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Worker 2 uniquement pour les API de Super Admin 2.
# Le HTML reste servi dans le même univers : https://univers.nyxia.top/superadmin2/
routes = [
  { pattern = "univers.nyxia.top/api/superadmin2/*", zone_name = "nyxia.top" }
]

# Même source de vérité que Super Admin 1 lorsque le partage est volontaire.
[[kv_namespaces]]
binding = "CASHFLOW_KV"
id = "106db6da016d49d2b480452f19bad695"

[vars]
SITE_URL = "https://univers.nyxia.top"

# ──────────────────────────────────────────────────────────────
# R2 RECOMMANDÉ pour téléverser directement les images/vidéos cœur,
# le fond vidéo officiel et conserver les images générées.
# Créer un bucket puis décommenter :
# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "nyxia-superadmin2-media"
# ──────────────────────────────────────────────────────────────

# SECRETS / VARIABLES D'ENVIRONNEMENT À CONFIGURER DANS CLOUDFLARE
# (ne jamais écrire leurs valeurs dans ce fichier ou GitHub) :
# ADMIN_INITIAL_PASSWORD
# AIMLAPI_CREATOR_KEY
# PEXELS_KEY
# UNSPLASH_ACCES_KEY   # le Worker accepte aussi UNSPLASH_ACCESS_KEY ou UNSPLASH_KEY
