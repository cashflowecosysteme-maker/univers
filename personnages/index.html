<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personnages Premium — NyXia Univers</title>
<link rel="icon" type="image/png" href="https://d1yei2z3i6k35z.cloudfront.net/1872133/6ab6b72bd02889.50501967_FavIcon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/personnages/css/personnages.css">
<script src="/personnages/js/personnages.js" defer></script>
</head>
<body>
<div class="aura"></div>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>✨ Personnages Premium</h1>
      <p>Le cœur vivant de l’écosystème NyXia · même KV · même D1 · même Formation Vivante</p>
    </div>
    <nav class="nav">
      <a href="/">Super Admin 1</a>
      <a href="/superadmin2/">Super Admin 2</a>
      <a href="/superadmin3/">Super Admin 3</a>
      <a href="/superadmin4/">Super Admin 4 · Portails</a>
      <a href="https://labo.nyxia.top/login" target="_blank" rel="noopener">🧪 Labo NyXia</a>
    </nav>
  </header>

  <section class="toolbar">
    <div>
      <label>Personnage existant</label>
      <select id="characterSelect"><option value="">— Choisir un personnage —</option></select>
    </div>
    <div>
      <label>Recherche</label>
      <input id="search" placeholder="Nom, rôle, tag…">
      <span id="status" class="status">Chargement…</span>
    </div>
    <div class="toolbar-actions">
      <button id="newBtn" class="btn">＋ Nouveau</button>
      <button id="saveBtn" class="btn primary">💾 Enregistrer</button>
    </div>
  </section>

  <div class="two-pane">
    <aside class="card sticky-list">
      <h3>Personnages</h3>
      <div id="characterList" class="list"></div>
    </aside>
    <main>
      <nav id="tabs" class="tabs"></nav>
      <section id="panel"></section>
    </main>
  </div>
</div>
</body>
</html>
